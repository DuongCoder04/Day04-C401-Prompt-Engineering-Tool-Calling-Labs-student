# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: |
      Lấy các bài đăng gần đây của MỘT tài khoản cụ thể. Dùng khi user hỏi về tweet/post CỦA một người.
      screenname phải là Twitter handle (không có @). Mapping tên thường gặp:
        Sam Altman → sama
        Elon Musk → elonmusk
        Andrej Karpathy → karpathy
        Yann LeCun → ylecun
        Greg Brockman → gdb
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle không có @, ví dụ: sama, elonmusk, karpathy"}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: |
      Tra cứu thông tin trên internet bằng Tavily. Dùng khi user muốn tìm tin tức hoặc thông tin chung trên web (không phải tweet, không phải URL cụ thể).
      QUAN TRỌNG — quy tắc viết query:
        - query phải là keyword ngắn gọn, ví dụ: "AI", "robotics", "OpenAI", "GPT-5"
        - KHÔNG thêm các từ như "news", "today", "latest", "hôm nay", "tin tức" vào query — những yếu tố đó đã được kiểm soát bởi `topic` và `timeframe`
        - SAI: "AI news today", "robotics news this week", "tin tức AI hôm nay"
        - ĐÚNG: "AI", "robotics", "OpenAI"
      Khi user nói "hôm nay/today" → timeframe=day. "Tuần này/this week" → timeframe=week.
      Khi user nói "tin tức/news" → topic=news. Mặc định topic=general.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword ngắn gọn, KHÔNG thêm 'news/today/latest'"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: news cho tin thời sự, general cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: day=hôm nay, week=tuần này"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- New tools ----------------
  - name: get_crypto_prices
    description: |
      Lấy giá crypto realtime. Dùng khi user hỏi về giá Bitcoin, Ethereum, hoặc bất kỳ coin nào.
      - symbols: danh sách ký hiệu coin, ví dụ ["BTC", "ETH"]. Để trống để lấy top coins theo rank.
      - base_currency: tiền tệ (mặc định USD).
      - limit: số coin cần lấy (mặc định 5).
    parameters:
      type: object
      properties:
        symbols: {type: array, items: {type: string}, default: [], description: "Danh sách ký hiệu coin, ví dụ ['BTC','ETH']"}
        base_currency: {type: string, default: "USD", description: "Tiền tệ cơ sở"}
        limit: {type: integer, default: 5, description: "Số coin cần lấy (tối đa 20)"}

  - name: summarize
    description: |
      Tóm tắt một đoạn văn bản dài bằng LLM. Dùng khi đã có nội dung từ fetch/paper_text và muốn rút gọn.
      - text: văn bản cần tóm tắt.
      - style: bullet (danh sách), paragraph (đoạn văn), tldr (1-2 câu).
      - max_words: giới hạn số từ (mặc định 150).
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Văn bản cần tóm tắt"}
        style: {type: string, enum: [bullet, paragraph, tldr], default: "bullet", description: "Kiểu tóm tắt"}
        max_words: {type: integer, default: 150, description: "Giới hạn số từ đầu ra"}
      required: [text]

  - name: check_weather
    description: |
      Lấy thông tin thời tiết hiện tại của một thành phố. Không cần API key.
      - city: tên thành phố (tiếng Anh hoặc tiếng Việt), ví dụ: "Hanoi", "Ho Chi Minh City".
      - unit: đơn vị nhiệt độ — celsius hoặc fahrenheit (mặc định celsius).
    parameters:
      type: object
      properties:
        city: {type: string, default: "Hanoi", description: "Tên thành phố"}
        unit: {type: string, enum: [celsius, fahrenheit], default: "celsius", description: "Đơn vị nhiệt độ"}
      required: [city]
